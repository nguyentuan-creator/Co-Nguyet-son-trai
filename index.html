<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cổ Nguyệt Sơn Trại</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    * {
      scrollbar-width: thin;
      scrollbar-color: #333537 transparent;
    }
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background-color: #333537; border-radius: 999px; }
    *::-webkit-scrollbar-thumb:hover { background-color: #4b4e52; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #131314;
      color: #e3e3e3;
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* Mobile drawer backdrop */
    #sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.58);
      z-index: 35;
    }

    /* Thanh điều hướng bên trái (đóng/mở kiểu Gemini) */
    #sidebar {
      width: 280px;
      background-color: #1e1f20;
      border-right: 1px solid #2b2d2f;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.22s ease, opacity 0.2s ease, transform 0.22s ease;
      overflow: hidden;
      z-index: 40;
    }
    #sidebar.collapsed {
      width: 0;
      border-right: none;
      opacity: 0;
    }
    .sidebar-inner {
      width: 280px;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 6px;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 10px;
    }
    .sidebar-title {
      font-size: 15px;
      font-weight: 600;
      color: #e3e3e3;
      white-space: nowrap;
    }
    .sidebar-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .nav-item {
      width: 100%;
      background: transparent;
      border: none;
      color: #c4c7c5;
      text-align: left;
      padding: 9px 12px;
      border-radius: 12px;
      font: inherit;
      font-size: 13.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .nav-item:hover {
      background-color: #282a2c;
      color: #e3e3e3;
    }
    .nav-item.primary-action {
      background-color: #282a2c;
      color: #e3e3e3;
      margin-bottom: 4px;
    }
    .nav-item.primary-action:hover { background-color: #333537; }

    .nav-accordion-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .nav-acc-right {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav-count {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
      background: #282a2c;
      color: #9aa0a6;
    }
    .nav-chevron {
      font-size: 11px;
      color: #8e918f;
      transition: transform 0.18s ease;
    }
    .nav-accordion-btn.open .nav-chevron { transform: rotate(90deg); }

    .sidebar-panel {
      display: none;
      margin: 2px 2px 6px;
      padding: 10px 11px;
      border-radius: 12px;
      background-color: #161718;
      border: 1px solid #2b2d2f;
      font-size: 12.5px;
      color: #c4c7c5;
      flex-direction: column;
      gap: 7px;
    }
    .sidebar-panel.open { display: flex; }

    .profile-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      line-height: 1.45;
    }
    .profile-val {
      color: #e3e3e3;
      font-weight: 500;
      text-align: right;
    }
    .mini-card {
      padding: 8px 9px;
      border-radius: 8px;
      background: #1e1f20;
      border: 1px solid #2b2d2f;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .bar-track {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: #282a2c;
      overflow: hidden;
      margin-top: 2px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: #4e9a84;
      transition: width 0.2s ease;
    }
    .bar-fill.warn { background: #c25959; }
    .pill-tag {
      display: inline-flex;
      align-items: center;
      font-size: 10.5px;
      padding: 1px 6px;
      border-radius: 4px;
      background: #282a2c;
      color: #c4c7c5;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pill-tag.jade { background: rgba(78, 154, 132, 0.18); color: #8ee0c6; }
    .pill-tag.warn { background: rgba(194, 89, 89, 0.18); color: #f0a4a4; }

    .sidebar-footer {
      padding-top: 8px;
      border-top: 1px solid #2b2d2f;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .icon-btn {
      background: transparent;
      color: #c4c7c5;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .icon-btn:hover { background-color: #282a2c; color: #e3e3e3; }

    /* Khu vực chính bên phải */
    #main-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #top-bar {
      min-height: 50px;
      padding: 6px 14px;
      border-bottom: 1px solid #222426;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
      flex-wrap: nowrap;
    }
    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow: hidden;
    }
    #open-sidebar-btn { display: none; }
    body.sidebar-closed #open-sidebar-btn { display: inline-flex; }

    #world-clock {
      font-size: 13px;
      color: #9aa0a6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-pill {
      background: #1e1f20;
      color: #c4c7c5;
      border: 1px solid #333537;
      border-radius: 999px;
      padding: 5px 12px;
      font: inherit;
      font-size: 12.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .top-pill:hover { background: #282a2c; color: #e3e3e3; }
    .top-pill.connected { border-color: #3d6b5e; color: #96dec7; }
    #loc-pill { display: none; }
    #loc-pill.visible { display: inline-flex; align-items: center; gap: 4px; }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 22px 16px;
    }
    .chat-content {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .empty-welcome {
      margin: 16vh auto 0;
      text-align: center;
      color: #9aa0a6;
      max-width: 480px;
      line-height: 1.7;
      padding: 0 12px;
    }
    .empty-welcome h2 {
      color: #e3e3e3;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .message {
      max-width: 85%;
      padding: 12px 18px;
      border-radius: 18px;
      line-height: 1.72;
      font-size: 15px;
      word-break: break-word;
    }
    .message.ai {
      align-self: flex-start;
      max-width: 100%;
      padding: 4px 0;
      color: #e3e3e3;
    }
    .message.ai strong {
      color: inherit;
      font-weight: 600;
    }
    .message.ai hr {
      border: none;
      border-top: 1px solid #2f3133;
      margin: 14px 0;
    }
    .message.user {
      align-self: flex-end;
      background-color: #282a2c;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }
    .message.error {
      align-self: stretch;
      max-width: 100%;
      background-color: rgba(194, 89, 89, 0.14);
      border: 1px solid rgba(194, 89, 89, 0.4);
      color: #f2b4b4;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .retry-btn {
      background: #282a2c;
      color: #e3e3e3;
      border: 1px solid #44474a;
      border-radius: 8px;
      padding: 6px 12px;
      font: inherit;
      font-size: 12.5px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .retry-btn:hover { background: #333537; }

    /* Chi tiết lượt ẩn mặc định + lượng token tiêu hao */
    .turn-details-wrap { margin-top: 6px; }
    .msg-meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .token-usage-meta {
      font-size: 11.5px;
      color: #6e7277;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.1px;
      user-select: text;
    }
    .turn-details-toggle {
      background: transparent;
      border: none;
      color: #7c8085;
      font: inherit;
      font-size: 11.5px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .turn-details-toggle:hover { color: #b5b9be; background: #1e1f20; }
    .turn-details-box {
      display: none;
      margin-top: 6px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #1a1b1c;
      border: 1px solid #2b2d2f;
      font-size: 12px;
      color: #9aa0a6;
      flex-direction: column;
      gap: 6px;
    }
    .turn-details-box.open { display: flex; }
    .detail-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .detail-list { margin-left: 16px; display: flex; flex-direction: column; gap: 2px; }

    .ending-banner {
      padding: 16px 18px;
      border-radius: 14px;
      background: #1e1f20;
      border: 1px solid #3c3e40;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #prompt-bar { padding: 10px 16px 20px; flex-shrink: 0; }
    #turn-status {
      max-width: 760px;
      margin: 0 auto 6px;
      padding-left: 12px;
      font-size: 12px;
      color: #8e918f;
      min-height: 16px;
    }
    #prompt-box {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background-color: #1e1f20;
      border: 1px solid #333537;
      border-radius: 28px;
      padding: 10px 12px 10px 18px;
    }
    #prompt-box:focus-within { border-color: #55585c; }
    #input {
      margin-bottom: 5px;
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: inherit;
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      max-height: 160px;
    }
    button[type="submit"] {
      background: #e3e3e3;
      color: #131314;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
    }
    button[type="submit"]:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Shared Modals (API + Map) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 60;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      background: #1e1f20;
      border: 1px solid #333537;
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-card.wide { max-width: 780px; }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .modal-head h3 { font-size: 16px; font-weight: 600; }
    .field label {
      display: block;
      font-size: 13px;
      color: #c4c7c5;
      margin-bottom: 6px;
    }
    .field-row { display: flex; gap: 8px; }
    .field input,
    .field select {
      width: 100%;
      background: #131314;
      color: #e3e3e3;
      border: 1px solid #333537;
      border-radius: 10px;
      padding: 9px 12px;
      font: inherit;
      font-size: 13.5px;
      outline: none;
    }
    .field input:focus,
    .field select:focus { border-color: #6b7075; }
    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      background: #282a2c;
      color: #e3e3e3;
      border: 1px solid #3c3e40;
      border-radius: 10px;
      padding: 8px 13px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover:not(:disabled) { background: #333537; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.primary {
      background: #e3e3e3;
      color: #131314;
      border-color: #e3e3e3;
      font-weight: 600;
    }
    .btn.primary:hover { background: #ffffff; }
    .api-status-msg { font-size: 12.5px; color: #9aa0a6; min-height: 18px; }
    .api-status-msg.ok { color: #8be0c5; }
    .api-status-msg.err { color: #f2a4a4; }
    .save-row {
      padding-top: 12px;
      border-top: 1px solid #2b2d2f;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Map Popup styling */
    .z-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .z-tab {
      background: #282a2c;
      color: #c4c7c5;
      border: 1px solid #333537;
      border-radius: 999px;
      padding: 5px 11px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .z-tab.active {
      background: rgba(78, 154, 132, 0.2);
      border-color: #4e9a84;
      color: #9be0cb;
      font-weight: 600;
    }
    .map-box {
      width: 100%;
      height: 360px;
      background: #131314;
      border: 1px solid #2b2d2f;
      border-radius: 12px;
      overflow: hidden;
    }
    .map-inspector {
      padding: 12px;
      border-radius: 12px;
      background: #161718;
      border: 1px solid #2b2d2f;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }
    .map-insp-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .map-insp-desc { color: #9aa0a6; line-height: 1.55; }
    .map-insp-links { display: flex; flex-wrap: wrap; gap: 6px; }
    .map-insp-links .btn { padding: 5px 10px; font-size: 12px; }
    .map-insp-go { display: flex; justify-content: flex-end; }

    /* Responsive: Tablet & Mobile (<= 820px) */
    @media (max-width: 820px) {
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 285px;
        max-width: 84vw;
        transform: translateX(0);
        opacity: 1;
      }
      #sidebar.collapsed {
        width: 285px;
        transform: translateX(-100%);
        opacity: 0;
        pointer-events: none;
      }
      .sidebar-inner { width: 100%; }
      body:not(.sidebar-closed) #sidebar-backdrop { display: block; }
      #top-bar { padding: 6px 10px; gap: 6px; }
      #world-clock { font-size: 12px; }
      .top-pill { padding: 4px 9px; font-size: 11.5px; }
      #chat-container { padding: 14px 12px; }
      .message { max-width: 94%; font-size: 14.5px; }
      #prompt-bar { padding: 8px 10px 14px; }
      #prompt-box { padding: 8px 10px 8px 14px; }
      .map-box { height: 270px; }
      .modal-card { padding: 14px 15px; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <div id="sidebar-backdrop" aria-hidden="true"></div>

  <aside id="sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-header">
        <span class="sidebar-title">Cổ Nguyệt Sơn Trại</span>
        <button type="button" class="icon-btn" id="close-sidebar-btn" title="Thu gọn thanh điều hướng">☰</button>
      </div>

      <nav class="sidebar-nav">
        <button type="button" class="nav-item primary-action" id="new-chat-btn">+ Cuộc trò chuyện mới</button>

        <button type="button" class="nav-item nav-accordion-btn" data-acc="profile" aria-expanded="false">
          <span>Nhân vật & Chỉ số</span>
          <span class="nav-chevron">▸</span>
        </button>
        <div id="panel-profile" class="sidebar-panel"></div>

        <button type="button" class="nav-item nav-accordion-btn" data-acc="gu" aria-expanded="false">
          <span>Cổ trùng</span>
          <span class="nav-acc-right"><span class="nav-count" id="count-gu">0</span><span class="nav-chevron">▸</span></span>
        </button>
        <div id="panel-gu" class="sidebar-panel"></div>

        <button type="button" class="nav-item nav-accordion-btn" data-acc="inventory" aria-expanded="false">
          <span>Túi đồ</span>
          <span class="nav-acc-right"><span class="nav-count" id="count-stones">0 NT</span><span class="nav-chevron">▸</span></span>
        </button>
        <div id="panel-inventory" class="sidebar-panel"></div>

        <button type="button" class="nav-item nav-accordion-btn" data-acc="npcs" aria-expanded="false">
          <span>NPC & Quan hệ</span>
          <span class="nav-acc-right"><span class="nav-count" id="count-npcs">0</span><span class="nav-chevron">▸</span></span>
        </button>
        <div id="panel-npcs" class="sidebar-panel"></div>

        <button type="button" class="nav-item nav-accordion-btn" data-acc="memory" aria-expanded="false">
          <span>Ký ức & Nghĩa vụ</span>
          <span class="nav-chevron">▸</span>
        </button>
        <div id="panel-memory" class="sidebar-panel"></div>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="nav-item" id="open-map-btn">Bản đồ Thanh Mao Sơn</button>
        <button type="button" class="nav-item" id="open-api-sidebar-btn">Cài đặt API & Save</button>
      </div>
    </div>
  </aside>

  <div id="main-area">
    <header id="top-bar">
      <div class="top-bar-left">
        <button type="button" class="icon-btn" id="open-sidebar-btn" title="Mở thanh điều hướng">☰</button>
        <span id="world-clock"></span>
        <button type="button" class="top-pill" id="loc-pill" title="Nhấn để mở bản đồ"></button>
      </div>
      <button type="button" class="top-pill" id="api-status-btn">Chưa kết nối API</button>
    </header>

    <main id="chat-container">
      <div class="chat-content"></div>
    </main>

    <form id="prompt-bar" method="POST">
      <div id="turn-status"></div>
      <div id="prompt-box">
        <textarea id="input" name="action" rows="1" placeholder="Gõ /khoi tao để bắt đầu Khai Khiếu Đại Điển..."></textarea>
        <button type="submit">➤</button>
      </div>
    </form>
  </div>

  <!-- Popup Cài đặt Google AI Studio API & Save -->
  <div id="api-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Cài đặt Google AI Studio API">
    <div class="modal-card">
      <div class="modal-head">
        <h3>Kết nối Google AI Studio (Gemini)</h3>
        <button type="button" class="icon-btn" id="close-api-modal-btn" title="Đóng">✕</button>
      </div>

      <div class="field">
        <label for="api-key-input">Gemini API Key (chỉ lưu cục bộ trên trình duyệt)</label>
        <div class="field-row">
          <input id="api-key-input" type="password" placeholder="Dán API Key (AIza...) vào đây" autocomplete="off" />
          <button type="button" class="btn" id="toggle-key-btn">Hiện</button>
        </div>
      </div>

      <div class="field">
        <label for="model-select">Model Gemini</label>
        <select id="model-select"></select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn" id="test-api-btn">Kiểm tra & tải model</button>
        <button type="button" class="btn primary" id="save-api-btn">Lưu & đóng</button>
      </div>
      <div id="api-test-result" class="api-status-msg"></div>

      <div class="save-row">
        <button type="button" class="btn" id="export-save-btn">Xuất save.json</button>
        <button type="button" class="btn" id="import-save-btn">Nhập save.json</button>
        <input id="import-save-file" type="file" accept=".json,application/json" style="display:none" />
      </div>
    </div>
  </div>

  <!-- Popup Bản đồ Thanh Mao Sơn (2D + Z) -->
  <div id="map-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Bản đồ Thanh Mao Sơn">
    <div class="modal-card wide">
      <div class="modal-head">
